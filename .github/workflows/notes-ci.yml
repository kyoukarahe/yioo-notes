name: Notes CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: notes-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  release:
    name: Linux / ${{ matrix.renderer }} / Docker + browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        renderer: [astro, manual]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run ci:source
      - name: Build and verify the isolated renderer
        env:
          RENDERER: ${{ matrix.renderer }}
        run: docker build --build-arg RENDERER="$RENDERER" -t notes-preview --target preview .
      - name: Serve exactly the verified files
        run: |
          docker run -d --name notes-preview --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m --cpus 1 --pids-limit 64 -p 127.0.0.1:8798:8798 notes-preview
          mkdir -p dist output/ci
          docker cp notes-preview:/app/dist/notes dist/notes
          docker cp notes-preview:/app/release.json output/ci/release.json
          IMAGE_BYTES=$(docker image inspect notes-preview --format '{{.Size}}')
          docker inspect notes-preview --format "{\"image\":\"{{.Image}}\",\"imageBytes\":$IMAGE_BYTES,\"memoryLimit\":{{.HostConfig.Memory}},\"cpuNano\":{{.HostConfig.NanoCpus}},\"readOnly\":{{.HostConfig.ReadonlyRootfs}},\"user\":\"{{.Config.User}}\"}" > output/ci/docker.json
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run verify:build
      - name: Actual HTTP and desktop/mobile browser verification
        run: npm run ci:browser
        env:
          NOTES_BASE_URL: http://127.0.0.1:8798
      - name: Stop only this preview
        if: always()
        run: |
          if docker container inspect notes-preview >/dev/null 2>&1; then
            docker stats --no-stream notes-preview
            docker stop notes-preview
            docker rm notes-preview
          fi
      - name: Enforce report allowlist and size limit
        if: always()
        id: artifacts
        run: npm run ci:artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.artifacts.outcome == 'success'
        with:
          name: notes-${{ matrix.renderer }}-${{ github.sha }}
          path: output/artifacts/
          retention-days: 7
          if-no-files-found: ignore
  windows-security:
    name: Windows deployment guards
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run test:security
