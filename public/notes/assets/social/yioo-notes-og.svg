  <text x="196" y="158" fill="#66716d" font-family="Arial, sans-serif" font-size="21">yioo.link/notes</text>
  <text x="92" y="324" fill="#1c231f" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="64" font-weight="700">에세이 · 조사 · 구현 기록</text>
  <text x="96" y="394" fill="#66716d" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="29">일과 도구, AI와 생활 속 선택을 오래 남길 글로 정리합니다.</text>
