    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f746b"/>
      <stop offset="0.58" stop-color="#355f8a"/>
      <stop offset="1" stop-color="#9a3f3c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f4f7f2"/>
  <rect x="36" y="36" width="1128" height="558" rx="18" fill="#fffffb" stroke="#cbd7cf" stroke-width="2"/>
  <rect x="36" y="36" width="1128" height="558" rx="18" fill="url(#grid)" opacity="0.45"/>
  <rect x="36" y="36" width="1128" height="8" rx="4" fill="url(#accent)"/>
  <g transform="translate(92 92)">
