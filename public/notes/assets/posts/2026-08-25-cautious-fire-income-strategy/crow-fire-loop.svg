<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">까마귀 FIRE 축적 전략</title>
  <desc id="desc">소득에서 생활비와 비상자금을 나눈 뒤 남은 돈과 세후 현금흐름을 다시 투자하는 순환. 주가와 배당 변경은 통제하기 어려운 영역으로 구분한다.</desc>
  <rect width="1200" height="1100" fill="#f7f4ed"/>
  <rect x="70" y="70" width="1060" height="960" rx="42" fill="#ffffff" stroke="#202b38" stroke-width="4"/>

  <text x="600" y="145" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="42" font-weight="700" fill="#172331">까마귀 전략은 배당률보다 새 돈으로 움직인다</text>
  <text x="600" y="190" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" fill="#51606f">내가 바꿀 수 있는 흐름과 바꾸기 어려운 시장을 나눈다</text>

  <rect x="130" y="245" width="300" height="150" rx="28" fill="#dcefe4" stroke="#39714d" stroke-width="3"/>
  <text x="280" y="305" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#234c34">소득</text>
  <text x="280" y="350" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="23" fill="#365d43">본업 · 가능한 부업</text>

  <path d="M430 320 H510" stroke="#39714d" stroke-width="10" stroke-linecap="round"/>
  <path d="M510 320 l-22 -17 v34 z" fill="#39714d"/>

  <rect x="520" y="245" width="300" height="150" rx="28" fill="#fff1ce" stroke="#b07918" stroke-width="3"/>
  <text x="670" y="305" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="31" font-weight="700" fill="#704a0d">생활비 점검</text>
  <text x="670" y="350" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="23" fill="#73551f">만족을 덜 해치는 지출부터</text>

  <path d="M820 320 H900" stroke="#b07918" stroke-width="10" stroke-linecap="round"/>
  <path d="M900 320 l-22 -17 v34 z" fill="#b07918"/>

  <rect x="910" y="245" width="170" height="150" rx="28" fill="#e4ebfa" stroke="#4569a8" stroke-width="3"/>
  <text x="995" y="300" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#2d4f87">새 돈</text>
  <text x="995" y="343" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" fill="#45608a">투자 여력</text>

  <path d="M995 395 V485" stroke="#4569a8" stroke-width="10" stroke-linecap="round"/>
  <path d="M995 485 l-17 -22 h34 z" fill="#4569a8"/>

  <rect x="800" y="500" width="280" height="150" rx="28" fill="#e4ebfa" stroke="#4569a8" stroke-width="3"/>
  <text x="940" y="585" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#2d4f87">인컴 자산</text>

  <path d="M800 575 H690" stroke="#4569a8" stroke-width="10" stroke-linecap="round"/>
  <path d="M690 575 l22 -17 v34 z" fill="#4569a8"/>

  <rect x="390" y="500" width="290" height="150" rx="28" fill="#e8def5" stroke="#725397" stroke-width="3"/>
  <text x="535" y="558" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="29" font-weight="700" fill="#513774">세후 현금흐름</text>
  <text x="535" y="604" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" fill="#6a5087">배당 · 분배금</text>

  <path d="M535 650 V720 H940 V665" fill="none" stroke="#725397" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M940 665 l-17 22 h34 z" fill="#725397"/>
  <text x="735" y="705" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" font-weight="600" fill="#60447f">다시 보탠다</text>

  <rect x="130" y="500" width="210" height="150" rx="28" fill="#fbe4e2" stroke="#a65049" stroke-width="3"/>
  <text x="235" y="552" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#7e3834">비상자금</text>
  <text x="235" y="594" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" fill="#824a46">투자 순환 밖에</text>
  <text x="235" y="624" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" fill="#824a46">따로 둔다</text>

  <rect x="130" y="790" width="950" height="165" rx="30" fill="#f2f4f7" stroke="#738092" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="605" y="842" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#3d4a59">내가 정하기 어려운 것</text>
  <text x="605" y="891" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="24" fill="#4f5e6e">주가 · 시장 분위기 · 배당과 분배금의 변경 · 돌발 뉴스</text>
  <text x="605" y="930" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" fill="#6a7683">현금이 들어와도 이 위험이 사라지는 것은 아니다</text>

  <text x="600" y="1000" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="23" font-weight="600" fill="#172331">목표: 가장 빠른 수익이 아니라 계속할 수 있는 축적 구조</text>
</svg>
